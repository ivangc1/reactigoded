name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Lint + typecheck + unit + contrast + build + size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        # `--legacy-peer-deps` mientras tengamos peer-deps en conflicto;
        # el README documenta el porqué.
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (CI mode — pool=forks, isolate=true)
        # Usamos test:unit:ci en CI: aislamiento estricto + forks
        # detecta side-effects entre tests que test:unit deja pasar
        # por el workaround WSL.
        run: npm run test:unit:ci

      - name: Contrast guard (WCAG + OKLCH + ΔE)
        run: npm run test:contrast

      - name: CSS scope-leak guard (--strict)
        # Bloquea si una clase modificadora (-active, -danger, -open, etc.)
        # se emite en >1 elemento de un mismo componente sin compound CSS
        # selector. Patrón histórico: bug Stepper beta.20 con
        # `.ig-step-active`. Allowlist en scripts/scope-leak-allowlist.json.
        run: npm run test:scope-leaks

      - name: Hex drift guard (--strict)
        # B-02 (gate review beta.24): detecta hex literales hardcoded
        # que han quedado stale tras recalibración de tokens cardinales.
        # Patrón histórico: beta.16 recalibró vitreus/axis/cinis, ~10-15
        # hex stale quedaron silenciosamente en stories/docs hasta
        # detección manual en beta.18. Sin este gate, ningún test los
        # caza. Allowlist en scripts/hex-drift-allowlist.json para hex
        # intencionalmente cercanos a tokens (Storybook chrome, ejemplos
        # docs históricos).
        run: npm run test:hex-drift

      - name: Server-safe markers gate (D1-P1)
        # AST gate sobre componentes marcados `@server-safe`. Verifica
        # que no acceden client globals en render path, no usan hooks
        # deferred-only sin guard, no tienen "use client" directive.
        # Test runner: scripts/check-server-safe-markers.mjs.
        run: npm run test:server-safe-markers

      - name: Build (lib + dts + styles)
        run: npm run build

      - name: Publint gate (D1-P3)
        # Valida package.json exports + types resolution. Aceptamos
        # warnings actualmente (1 sobre types ESM en condición require);
        # D1-P4 (ESM-only) los elimina.
        run: npm run test:publint

      - name: RSC fixture typecheck (D1-P3)
        # Compila un Server Component sintético que importa los 36
        # exports del subset server-safe (resolución vía
        # customConditions: ["react-server"] + paths a dist/). Si
        # una regresión rompe la firma o disponibilidad de cualquier
        # export, este typecheck falla.
        run: npm run test:rsc-fixture

      - name: Bundle has no dev warns (B-07 follow-up, post-RC1 refined)
        # B-07 movió los warn dev-only de \`isDev()\` a \`import.meta.env.DEV\`
        # para que esbuild/Vite los hagan DCE en producción. Si una
        # regresión introduce un \`console.warn\` que no respeta el guard,
        # llegaría al bundle publicado. size-limit lo detecta indirectamente
        # como crecimiento; este step lo fuerza directamente.
        #
        # Post-RC1 (Tooltip Floating UI): el assertion blanket
        # \`grep -c 'console\\.'\` mezclaba dos clases distintas:
        #   (1) dev-warns nuestros que deben podarse en producción.
        #   (2) errores runtime legítimos de terceros (ej. tabbable
        #       dispara \`console.error\` cuando detecta un radio button
        #       mal configurado en runtime — info útil en producción
        #       que no debe podarse aunque pudiéramos).
        # La intención original del guardrail B-07 era detectar (1).
        # Restringiendo el match al prefijo \`[reactigoded]\` (firma
        # única de nuestros warns) cubrimos exactamente el caso de
        # regresión nuestra y dejamos pasar los logs propios de deps.
        # \`grep -F\` (fixed string, no regex) es lo más a prueba de
        # futuro si mañana cambia el prefijo a algo con caracteres
        # especiales.
        run: |
          test "$(grep -cF '[reactigoded]' dist/index.js  || true)" = "0"
          test "$(grep -cF '[reactigoded]' dist/index.cjs || true)" = "0"

      - name: Size budgets
        run: npm run verify:size

  storybook:
    name: Storybook + axe (browser tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        # vitest-browser usa playwright internamente; sin esto los
        # browser tests de Storybook no arrancan.
        run: npx playwright install --with-deps chromium

      - name: Storybook tests (vitest browser + axe-core)
        run: npm run test:storybook
