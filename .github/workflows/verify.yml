name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Matriz CI (#151 beta.27): OS × Node engine min/latest.
    # Razón: los blockers de beta.24 (POSIX `rm` en clean script; attw
    # crash en Windows) eran specific-to-platform, invisibles desde
    # Linux y solo cazados manualmente por Codex en su sandbox real.
    # Esta matriz es la red de seguridad que los habría cazado
    # automáticamente.
    #   - ubuntu-latest + Node 22.12.0: baseline (engine mínimo del
    #     package.json, lo que se publicaba pre-#151).
    #   - ubuntu-latest + Node 24: forward compat con Node current.
    #   - windows-latest + Node 22.12.0 / 24: paridad de plataforma del
    #     paquete publicado. Caza POSIX-only commands, path separator
    #     leaks, line-ending sensitivity, shell-specific scripts.
    # `fail-fast: false` para que un fallo en Windows-Node24 no aborte
    # los runs de ubuntu (queremos ver todas las matrices fallar/pasar
    # independientemente para diagnosticar root-cause sin overlap).
    name: "unit (${{ matrix.os }}, Node ${{ matrix.node }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.12.0", "24"]
    # Sin override de shell: todos los steps invocan `npm run ...` o
    # `npx ...`, que son cross-platform. El único step inline que
    # requería bash (`grep -cF '[reactigoded]'`) se migró a
    # `node scripts/check-no-dev-warns.mjs` — cierra el cabo del
    # shell-dependency sin necesidad de `defaults.run.shell: bash`.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # ERESOLVE de devDeps (eslint 10 vs plugins peer ^9) resuelto por
        # `overrides` en package.json (#138) → `npm ci` plano ya pasa.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: CI cubre la cadena de verify (anti-drift, A-CI-02)
        # Este fichero reimplementa a mano la cadena de `npm run verify` para
        # que el log muestre qué gate falló y para poder documentar cada step.
        # El precio es que las dos listas pueden divergir en silencio, y ya han
        # divergido dos veces (`test:state-css-exclusion` pre-beta.25,
        # `test:public-api` en el gate 1.0.0). Este gate compara ambas: cerrar
        # el caso concreto no cierra la clase.
        #
        # Va pronto a propósito: es barato y falla antes de gastar 20 minutos
        # de matriz para descubrir que un gate no estaba corriendo.
        run: npm run test:ci-covers-verify

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (CI mode — pool=forks, isolate=true)
        # Usamos test:unit:ci en CI: aislamiento estricto + forks
        # detecta side-effects entre tests que test:unit deja pasar
        # por el workaround WSL.
        run: npm run test:unit:ci

      - name: Contrast guard (WCAG + OKLCH + ΔE)
        run: npm run test:contrast

      - name: CSS scope-leak guard (--strict)
        # Bloquea si una clase modificadora (-active, -danger, -open, etc.)
        # se emite en >1 elemento de un mismo componente sin compound CSS
        # selector. Patrón histórico: bug Stepper beta.20 con
        # `.ig-step-active`. Allowlist en scripts/scope-leak-allowlist.json.
        run: npm run test:scope-leaks

      - name: Hex drift guard (--strict)
        # B-02 (gate review beta.24): detecta hex literales hardcoded
        # que han quedado stale tras recalibración de tokens cardinales.
        # Patrón histórico: beta.16 recalibró vitreus/axis/cinis, ~10-15
        # hex stale quedaron silenciosamente en stories/docs hasta
        # detección manual en beta.18. Sin este gate, ningún test los
        # caza. Allowlist en scripts/hex-drift-allowlist.json para hex
        # intencionalmente cercanos a tokens (Storybook chrome, ejemplos
        # docs históricos).
        run: npm run test:hex-drift

      - name: Server-safe markers gate (D1-P1)
        # AST gate sobre componentes marcados `@server-safe`. Verifica
        # que no acceden client globals en render path, no usan hooks
        # deferred-only sin guard, no tienen "use client" directive.
        # Test runner: scripts/check-server-safe-markers.mjs.
        run: npm run test:server-safe-markers

      - name: Build (lib + dts + styles)
        run: npm run build

      - name: dist .d.ts compilan como programa (B34-1)
        # Compila los `.d.ts` del tarball con `skipLibCheck:false` y `types:[]`
        # en Bundler Y NodeNext. Las fixtures de consumer solo ven lo que se
        # importa desde una entry: `dist/components/Slot/index.d.ts` shippeó
        # con 3×TS2305 porque ningún consumer puede alcanzar ese barrel.
        run: npm run test:dist-dts

      - name: state.css exclusion gate (H-07/D9)
        # Verifica que dist/index.js no arrastra utilities pseudo-class
        # del state.css (713 KB gzip standalone). Si un componente del
        # DS empieza a referenciar clases con prefijo `hover:ig-`,
        # `focus:ig-`, etc., este gate lo caza pre-publish. Antes de
        # beta.25 el script existía en verify:unit pero NO en CI; el
        # cruce de gate reviews (Codex + Claude) lo cazó.
        run: npm run test:state-css-exclusion

      - name: Public API freeze gate (§5.13)
        # A-CI-02: este gate estaba encadenado en `verify:unit` pero NO aquí,
        # así que una mutación de `src/_audit/public-api-names.json` pasaba los
        # checks requeridos y solo habría muerto en `prepublishOnly` — es decir,
        # con el tag protegido ya creado e irreversible.
        #
        # Es la SEGUNDA vez que este repo sufre esta misma clase de drift (la
        # primera, con `test:state-css-exclusion`, está documentada en el step
        # de arriba). Por eso, además del step, hay un gate que compara la
        # cadena de `verify` con los steps de este fichero: cerrar el caso
        # concreto sin cerrar el espacio es lo que permitió la reincidencia.
        run: npm run test:public-api

      - name: Publint gate (D1-P3)
        # Valida package.json exports + types resolution. Aceptamos
        # warnings actualmente (1 sobre types ESM en condición require);
        # D1-P4 (ESM-only) los elimina.
        run: npm run test:publint

      - name: RSC fixture typecheck (D1-P3)
        # Compila un Server Component sintético que importa los 36
        # exports del subset server-safe (resolución vía
        # customConditions: ["react-server"] + paths a dist/). Si
        # una regresión rompe la firma o disponibilidad de cualquier
        # export, este typecheck falla.
        run: npm run test:rsc-fixture

      - name: Consumer types typecheck (beta.25 B3 + B3.alias-leak)
        # Simula a un consumer enterprise con `skipLibCheck: false`
        # sobre los .d.ts publicados. Caza dos clases de bug:
        #   1. .d.ts autocontradictorios (Step.d.ts pre-B3:
        #      destructuring de props @internal que stripInternal había
        #      borrado). Codex BLOCKER 3 del gate review beta.25.
        #   2. Alias `@/...` no resueltos en .d.ts (AlertDialog/
        #      ThemeToggle pre-B3.alias-leak). tsc emite paths sin
        #      resolver; `tsc-alias` corre en `build` para reescribir
        #      a relative. Este gate caza regresiones del approach.
        # Diferencia clave con test:rsc-fixture: `skipLibCheck: false`
        # (vs true), valida CADA .d.ts referenciado como lo haría un
        # consumer real.
        run: npm run test:consumer-types

      - name: Consumer types typecheck (NodeNext ESM)
        # Gate v4/beta.26: el fixture Bundler anterior no detectaba
        # specifiers relativos sin extensión en `.d.ts` publicados.
        # Consumers ESM con `moduleResolution: NodeNext` sí los rechazan
        # (TS2834). Este gate fuerza `skipLibCheck:false` + NodeNext para
        # cubrir el modo ESM estricto que ATTW habría auditado si no
        # crasheara en este entorno.
        run: npm run test:consumer-types:nodenext

      - name: Consumer pack tarball gate (MEDIUM-1 beta.26)
        # Tarball-real-install gate. Diferencia clave vs los dos
        # `test:consumer-types(:nodenext)` anteriores: aquellos usan
        # `compilerOptions.paths` para apuntar a `dist/` directamente —
        # NO ejercitan resolución vía `node_modules`, interpretación del
        # `exports` field por npm/node real, ni cadena de peer deps
        # resuelta por npm.
        #
        # Este gate hace `npm pack` → instala el tarball en un sandbox
        # temporal → corre `tsc --noEmit` (Bundler + NodeNext) sobre un
        # fixture que importa desde "reactigoded" + subpaths
        # `/server-safe` y `/cn`. Caza el flow END-TO-END que un consumer
        # real haría tras `npm install reactigoded`.
        #
        # Codex propuso este gate en el cruce beta.25 (MEDIUM-1).
        # Justificación retroactiva: el bug NodeNext .d.ts (259× TS2834
        # cazado por Codex en sandbox tarball, invisible con `paths`) es
        # exactamente la clase de regresión que solo emerge con pack
        # real. Este gate previene regresiones similares durante el
        # refactor Slot DS-wide upcoming en beta.27.
        run: npm run test:consumer-pack

      - name: Bundle has no dev warns (B-07 follow-up, #151 cross-platform)
        # B-07 movió los warn dev-only de `isDev()` a `import.meta.env.DEV`
        # para que esbuild/Vite los hagan DCE en producción. Si una
        # regresión introduce un `console.warn` que no respeta el guard,
        # llegaría al bundle publicado. Este gate lo caza directamente.
        #
        # Implementación: script Node (cross-platform genuino, sin
        # dependencia de `shell: bash` ni `grep -cF` POSIX). Mismo
        # razonamiento que clean.mjs (rm POSIX → Node fs/promises) que
        # cerró el blocker beta.24 BLOCKER 1. Ver scripts/check-no-dev-
        # warns.mjs para el historial completo (post-RC1 prefix refine,
        # #151 migración a Node).
        run: npm run test:no-dev-warns

      - name: Size budgets
        run: npm run verify:size

  storybook:
    name: Storybook + axe (browser tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # vitest-browser usa playwright internamente; sin esto los
        # browser tests de Storybook no arrancan.
        run: npx playwright install --with-deps chromium

      - name: Storybook tests (vitest browser + axe-core)
        run: npm run test:storybook
