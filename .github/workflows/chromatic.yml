name: Chromatic

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        # H-02 (rc1): visual review is gated. Removed --exit-zero-on-changes
        # (so a snapshot drift now FAILS the job) and --auto-accept-changes=main
        # (every change to main has to be approved by a human reviewer in
        # the Chromatic UI). --exit-once-uploaded stays so the job does not
        # block waiting for review — the gating is the green/red on the PR
        # and the manual approval in chromatic.com.
        run: npx chromatic --exit-once-uploaded --only-changed
