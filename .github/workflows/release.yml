name: Release

# Publica a npm al pushear un tag `v*` (convención del repo: v1.0.0-rc.2).
#
# AUTENTICACIÓN: Trusted Publishing (OIDC) — SIN token. GitHub emite un token
# efímero firmado, específico de ESTE workflow, que npm valida contra el Trusted
# Publisher configurado en el paquete. Elimina de raíz la fricción del publish
# manual (2FA, OTP caducando mientras corre el `verify` largo, tokens granulares
# que exigen scope de organización) y firma **provenance** automáticamente.
#
# ⚠️ REQUISITO MANUAL, UNA VEZ: en npmjs.com → paquete `reactigoded` → Settings →
# Trusted Publisher, dar de alta `ivangc1/reactigoded` con workflow
# `release.yml`. Sin eso el publish falla con error de autenticación: el
# workflow NO puede crear esa confianza por sí solo.
#
# ─── LA REGLA QUE GOBIERNA ESTE FICHERO (gate 1.0.0, A-REL-01) ───────────
# npm NO deriva la provenance del `actions/checkout`: la deriva de las
# variables del EVENTO (`GITHUB_REF`, `GITHUB_SHA`, `GITHUB_WORKFLOW_REF`; ver
# `libnpmpublish/lib/provenance.js`). Consecuencia medida en rc.1: un publish
# lanzado por `workflow_dispatch` desde main, aunque haga checkout del tag,
# produce un tarball CORRECTO con una provenance que firma `refs/heads/main` y
# el commit de main. La firma es criptográficamente válida y apunta al árbol
# equivocado — peor que no tener provenance, porque parece correcta.
#
# Por eso: **solo un push de tag puede publicar**. El modo manual existe, pero
# reducido a reconciliar la evidencia de algo ya publicado; nunca publica.

on:
  push:
    tags: ["v*"]
  # Re-lanzamiento MANUAL, en modo RECONCILIAR (no publica).
  #
  # Antes este modo publicaba, y era la vía de recuperación cuando el workflow
  # del commit del tag venía con un bug (Actions ejecuta el workflow TAL COMO
  # ESTÁ EN EL COMMIT DEL TAG, y el tag no se puede mover: una regla del repo
  # lo protege contra borrado, correctamente). Publicar así fue exactamente lo
  # que rompió la evidencia de rc.1. Hoy este modo sirve para: re-verificar la
  # provenance de una versión ya publicada y regenerar su registro durable.
  #
  # Si el workflow del tag está roto y el publish NUNCA ocurrió, la salida NO
  # es este modo: es un tag nuevo (`v1.0.0-rc.3`) con el workflow arreglado.
  # Cuesta un número de versión y es el precio de que la evidencia sea cierta.
  workflow_dispatch:
    inputs:
      version:
        description: "Versión ya publicada cuya evidencia se re-verifica (p.ej. 1.0.0-rc.2). NO publica."
        required: true

permissions:
  # `write` (no `read`) porque se crea la GitHub Release y se le sube el
  # registro durable como ASSET.
  contents: write
  # Obligatorio para que Actions pueda emitir el token OIDC. Sin este permiso
  # npm cae al flujo de token clásico y falla (no hay NPM_TOKEN).
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # En modo manual se opera sobre EL CÓDIGO DEL TAG, no el de la rama
          # desde la que se lanza. (En modo push ya es el tag por definición.)
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Node 24, NO el floor: trusted publishing exige npm >= 11.5.1 y el
          # floor trae npm 10.9. El floor sigue verificado por la matriz de
          # `verify.yml` (que es donde importa: compatibilidad del consumer).
          # Aquí solo se empaqueta y sube — el artefacto es idéntico.
          node-version: "24"
          cache: npm
          # SIN `registry-url` A PROPOSITO — no es un olvido.
          # setup-node, cuando se le pasa `registry-url`, escribe en .npmrc:
          #     //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # Sin NODE_AUTH_TOKEN (que es justo el caso en trusted publishing), eso
          # expande a VACIO. npm lee el .npmrc, da por hecho que "hay auth
          # configurada" y NUNCA inicia el intercambio OIDC -> el registry te
          # trata como anonimo -> un anonimo no puede PUT -> `E404 Not Found`
          # enganoso (npm devuelve 404 en vez de 403 para no filtrar existencia).
          # Bug upstream: actions/setup-node#1551. Reventó el primer intento de
          # release del rc.1. El registry por defecto ya es registry.npmjs.org,
          # asi que la linea no aportaba nada.

      - name: Comprobar npm >= 11.5.1 (mínimo de trusted publishing)
        # Fail-loud explícito: si una imagen futura del runner bajara la versión
        # de npm, el publish fallaría con un error de auth confuso. Mejor morir
        # aquí diciendo exactamente por qué.
        run: |
          NPM="$(npm -v)"
          echo "npm: $NPM"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} < 11.5.1 — trusted publishing (OIDC) no soportado`);
              process.exit(1);
            }
          ' "$NPM"

      - name: Resolver el tag, el commit del tag y el modo
        id: reltag
        # Guard contra el fallo silencioso más caro: publicar una versión bajo un
        # tag que promete otra cosa. npm no lo detecta.
        # Resuelve además el nombre del tag, que en modo manual NO es
        # `GITHUB_REF_NAME` (ahí seria la rama), y el COMMIT del tag, que es el
        # valor que se graba en el registro durable (ver A-REL-01: grabar
        # `$GITHUB_SHA` fue correcto por coincidencia, no por construcción).
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$IN_VERSION" != "$PKG" ]; then
              echo "::error::La versión indicada ($IN_VERSION) no coincide con el package.json del tag ($PKG)."
              exit 1
            fi
            TAG="v$PKG"
            MODE="reconcile"
          else
            TAG="$GITHUB_REF_NAME"
            if [ "${TAG#v}" != "$PKG" ]; then
              echo "::error::El tag ($TAG) no coincide con package.json ($PKG). Corrige el tag o el bump."
              exit 1
            fi
            MODE="publish"
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::El tag $TAG no existe en el repo."
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n1 "refs/tags/$TAG")"
          echo "modo: $MODE · evento: $GITHUB_EVENT_NAME · tag: $TAG · commit del tag: $TAG_COMMIT · package.json: $PKG"
          {
            echo "tag=$TAG"
            echo "tag_commit=$TAG_COMMIT"
            echo "mode=$MODE"
            echo "version=$PKG"
          } >> "$GITHUB_OUTPUT"

      - name: Guard de evento — solo un push de tag puede firmar provenance del tag
        # EL guard de A-REL-01, y es PRE-publish a propósito: la provenance
        # queda determinada por el evento en el instante del `npm publish`, y
        # una versión de npm es INMUTABLE. Un check posterior solo puede negarse
        # a escribir el registro; no puede arreglar una firma ya emitida.
        if: steps.reltag.outputs.mode == 'publish'
        env:
          REL_TAG: ${{ steps.reltag.outputs.tag }}
          TAG_COMMIT: ${{ steps.reltag.outputs.tag_commit }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] \
            || [ "$GITHUB_REF" != "refs/tags/$REL_TAG" ] \
            || [ "$GITHUB_SHA" != "$TAG_COMMIT" ]; then
            echo "::error::evento=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA no puede producir provenance de $REL_TAG@$TAG_COMMIT. npm deriva la SLSA de GITHUB_REF/GITHUB_SHA/GITHUB_WORKFLOW_REF, NO del checkout: publicar aquí firmaría el commit equivocado."
            exit 1
          fi
          echo "evento push sobre refs/tags/$REL_TAG @ $TAG_COMMIT ✓"

      - name: Comprobar que el README cita la versión que se publica
        # El README documenta la version publicada en su seccion de Instalacion.
        # Es el ULTIMO sitio con la version hardcodeada (el banner se desduplico
        # en #144), asi que deriva en cada bump si nadie se acuerda.
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if ! grep -qF "$PKG" README.md; then
            echo "::error::README.md no menciona la versión $PKG. Actualiza la sección de Instalación en el mismo commit del bump."
            exit 1
          fi
          echo "README cita $PKG ✓"

      - name: Derivar dist-tag desde la versión
        id: disttag
        # ANTES del install/verify a propósito: si el dist-tag no es derivable,
        # morir aquí y no tras varios minutos de verify (codex P2).
        #
        # Una prerelease NUNCA debe ir a `latest`. El identificador sale de la
        # propia versión, así que no puede desincronizarse de lo que se publica.
        # Sin regex frágil: expansión de parámetros (`${PKG#*-}` = todo tras el
        # primer guion; `${PRE%%.*}` = primer componente).
        #
        # OJO con el estado del registro: `latest` apunta a `1.0.0-beta.26` y NO
        # se puede quitar (400). Un `--tag rc` NO lo moverá, así que
        # `npm install reactigoded` seguirá dando la beta hasta el 1.0.0 final o
        # hasta moverlo a mano. Ver RC1_DECISIONS.md.
        run: |
          PKG="$(node -p "require('./package.json').version")"
          case "$PKG" in
            *-*) PRE="${PKG#*-}"; TAG="${PRE%%.*}" ;;
            *)   TAG="latest" ;;
          esac
          # npm RECHAZA un dist-tag que sea un semver válido. Una prerelease con
          # identificador numérico (`1.0.0-0`, `1.0.0-2026.1`) derivaría en un tag
          # inválido y el publish moriría DESPUÉS del verify. Fail-loud aquí.
          if ! printf '%s' "$TAG" | grep -qE '^[a-zA-Z][a-zA-Z0-9-]*$'; then
            echo "::error::dist-tag derivado inválido: '$TAG' (versión $PKG). Debe empezar por letra y no ser un semver. Usa un identificador alfabético (beta, rc, alpha) o publica a mano."
            exit 1
          fi
          echo "versión $PKG → dist-tag $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        # También en modo reconcile: `verify-provenance.mjs` necesita la devDep
        # `sigstore` para verificar la firma de la attestation SLSA.
        run: npm ci

      - name: Instalar Chromium (Playwright)
        # `npm publish` dispara `prepublishOnly: npm run verify`, y `verify`
        # incluye `verify:storybook` → vitest-browser → playwright. Sin esto el
        # guard de publicación falla por entorno, no por defecto real.
        # En modo reconcile no se publica, así que no hace falta.
        if: steps.reltag.outputs.mode == 'publish'
        run: npx playwright install --with-deps chromium

      - name: Publicar
        # SIN `--ignore-scripts` a propósito: `prepublishOnly` (verify completo)
        # es EL guard de publicación. Saltarlo para ahorrar minutos de CI lo
        # dejaría bypasseable en silencio; el tiempo de runner es barato
        # comparado con publicar algo roto de forma irreversible.
        # Tampoco hace falta `--provenance`: trusted publishing la firma sola.
        #
        # IDEMPOTENTE: una versión publicada es INMUTABLE, así que si el publish
        # funcionó pero un step posterior falló, un re-run normal de Actions
        # moriría aquí y el job quedaría rojo para siempre — sin poder crear el
        # registro duradero que falta. Se comprueba antes y se omite.
        #
        # Ya NO se valida aquí la attestation: eso lo hace el step siguiente con
        # `verify-provenance.mjs`, que corre SIEMPRE (se haya publicado ahora o
        # se esté re-verificando algo ya publicado). El guard inline anterior
        # vivía solo en esta rama y por tanto nunca se ejecutó sobre una
        # publicación real (A-REL-01).
        if: steps.reltag.outputs.mode == 'publish'
        env:
          APPLIED_TAG: ${{ steps.disttag.outputs.tag }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "reactigoded@$PKG" version >/dev/null 2>&1; then
            echo "::notice::reactigoded@$PKG ya existe en el registro — se omite el publish y se pasa a verificar su provenance."
          else
            npm publish --tag "$APPLIED_TAG"
          fi

      - name: Verificar la provenance publicada
        # Comprueba que la evidencia dice la verdad: attestation SLSA
        # seleccionada por `predicateType` (nunca por índice), firma verificada
        # contra Fulcio, firma de la attestation del registro verificada contra
        # las claves de npm, digest del subject == tarball servido, y ref/commit
        # atestados == el tag. Corre en los dos modos: es lo que convierte el
        # modo reconcile en algo útil.
        env:
          REL_TAG: ${{ steps.reltag.outputs.tag }}
          TAG_COMMIT: ${{ steps.reltag.outputs.tag_commit }}
          VERSION: ${{ steps.reltag.outputs.version }}
        run: |
          node scripts/verify-provenance.mjs "$VERSION" \
            --tag "$REL_TAG" \
            --commit "$TAG_COMMIT" \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/release.yml" \
            --event push

      - name: Registrar la publicación en la GitHub Release
        # ÚNICO artefacto duradero donde queda el dist-tag APLICADO.
        # No vale `npm view dist-tags`: un dist-tag es un puntero MUTABLE
        # (`npm dist-tag add` lo mueve — este repo incluso lo contempla para
        # `latest` en el rc.1), así que solo prueba el valor ACTUAL, no el que se
        # aplicó en este release. El log de Actions tampoco vale: su retención
        # caduca (máx. 400 días). Ver RC1_DECISIONS.md.
        #
        # El registro va como ASSET, no en el body: el body es a la vez notas
        # para humanos y registro de máquina, así que se pisan en las dos
        # direcciones. En rc.1 una edición manual del body borró la tabla que
        # este step había escrito — el registro "duradero" duró horas.
        env:
          GH_TOKEN: ${{ github.token }}
          APPLIED_TAG: ${{ steps.disttag.outputs.tag }}
          REL_TAG: ${{ steps.reltag.outputs.tag }}
          TAG_COMMIT: ${{ steps.reltag.outputs.tag_commit }}
          VERSION: ${{ steps.reltag.outputs.version }}
        run: |
          META="$(npm view "reactigoded@$VERSION" --json)"
          printf '%s' "$META" | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const m = JSON.parse(s);
              const integrity = String(m?.dist?.integrity ?? "");
              const rec = {
                version: process.env.VERSION,
                distTag: process.env.APPLIED_TAG,
                tag: process.env.REL_TAG,
                tagCommit: process.env.TAG_COMMIT,
                runId: process.env.GITHUB_RUN_ID,
                runAttempt: process.env.GITHUB_RUN_ATTEMPT,
                gitHead: m?.gitHead ?? null,
                tarballSha512: integrity.startsWith("sha512-")
                  ? Buffer.from(integrity.slice(7), "base64").toString("hex")
                  : null,
                attestationUrl: m?.dist?.attestations?.url ?? null,
              };
              require("node:fs").writeFileSync("release-record.json", JSON.stringify(rec, null, 2));
            });
          '
          cat release-record.json
          PRERELEASE=""
          if [ "$APPLIED_TAG" != "latest" ]; then PRERELEASE="--prerelease"; fi
          {
            printf '`reactigoded@%s` publicado en npm.\n\n' "$VERSION"
            printf '| | |\n|---|---|\n'
            printf '| dist-tag aplicado | `%s` |\n' "$APPLIED_TAG"
            printf '| commit del tag | `%s` |\n' "$TAG_COMMIT"
            printf '| workflow run | `%s` |\n\n' "$GITHUB_RUN_ID"
            printf 'Provenance firmada por trusted publishing (OIDC) y verificada por\n'
            printf '`scripts/verify-provenance.mjs`. El registro de máquina es el asset\n'
            printf '`release-record.json` — editar este texto no lo altera.\n'
          } > /tmp/release-notes.md
          # IDEMPOTENTE: si la release ya existe (creada a mano, o por un run
          # anterior que falló después), se actualiza en vez de reventar. Las
          # notas solo se escriben al CREARLA: si ya existe, se respeta el texto
          # humano y solo se re-sube el asset.
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            echo "::notice::La release $REL_TAG ya existe — se respeta su cuerpo y se re-sube el registro."
          else
            gh release create "$REL_TAG" \
              --verify-tag \
              --title "$REL_TAG" \
              --notes-file /tmp/release-notes.md \
              $PRERELEASE
          fi
          gh release upload "$REL_TAG" release-record.json --clobber

      - name: Verificar el registro durable
        # Cierra el bucle: el registro deja de ser prosa que alguien pueda
        # contradecir sin que salte nada.
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ steps.reltag.outputs.tag }}
          TAG_COMMIT: ${{ steps.reltag.outputs.tag_commit }}
          VERSION: ${{ steps.reltag.outputs.version }}
        run: |
          mkdir -p /tmp/rec
          gh release download "$REL_TAG" -p release-record.json -D /tmp/rec --clobber
          node scripts/verify-provenance.mjs "$VERSION" \
            --tag "$REL_TAG" \
            --commit "$TAG_COMMIT" \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/release.yml" \
            --event push \
            --check-release-record /tmp/rec/release-record.json
